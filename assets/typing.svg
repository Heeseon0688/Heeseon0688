<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 1000 100'
    style='background-color: #00000000;'
    width='1000px' height='100px'>

    <style>
@font-face {
  font-family: 'Alkatra';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h1000 ; m0,50 h1000 ; m0,50 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
                    </path>
    <text font-family='"Alkatra", monospace' fill='#6994CDEE' font-size='45'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Heeseon Im | Software Engineer
        </textPath>
    </text>
</svg>
